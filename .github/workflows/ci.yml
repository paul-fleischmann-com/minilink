name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain-Versionen
        run: |
          gcc --version
          rustc --version
          cargo --version
          readelf --version | head -1
          addr2line --version | head -1

      - name: build_and_test.sh (C + Rust, inkl. Byte-Identitaets-Check)
        run: ./build_and_test.sh

      - name: hyperfine installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq hyperfine

      - name: Linkzeit C vs. Rust messen (bench.sh)
        run: ./bench.sh
